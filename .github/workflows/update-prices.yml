name: Update prices & rebuild

# Weekly: refresh LiteLLM price data, rebuild the static site, and commit
# only if something actually changed. If the fetch fails, this workflow
# fails loudly in the Actions tab and the live site simply keeps serving
# the previous build — no human intervention required.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest LiteLLM prices
        run: python3 fetch_data.py

      - name: Rebuild site
        run: python3 build_site.py

      - name: Commit on diff
        run: |
          git config user.name "costwarden-bot"
          git config user.email "bot@costwarden.com"
          git add data/prices.json dist
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "chore: weekly price data update"
            git push
          fi
